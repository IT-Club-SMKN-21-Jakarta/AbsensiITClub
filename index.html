<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi • IT Club</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- CSS User (File Terpisah) -->
    <link rel="stylesheet" href="styles.css">

    <!-- Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
</head>

<body>
    <div class="user-container">
        <!-- Header Card -->
        <div class="header-section">
            <div class="logo-badge">
                <div class="logo-badge-inner">
                    <span class="it-text">IT</span>
                    <span class="club-text">Club</span>
                </div>
            </div>
            <h1>Presensi IT Club</h1>
            <p class="subtitle">Isi data diri & tanda tangan digital</p>
        </div>

        <!-- Token Section - Highlighted -->
        <div class="token-section">
            <div class="token-icon">
                <i class="fas fa-lock"></i>
            </div>
            <div class="token-input-wrapper">
                <label for="tokenUser">Token Absensi</label>
                <input type="text" id="tokenUser" placeholder="Masukkan token dari admin" autocomplete="off"
                    maxlength="10">
            </div>
            <div class="token-status" id="tokenStatus">
                <i class="fas fa-circle"></i> Menunggu token
            </div>
        </div>

        <!-- Form Section -->
        <div class="form-section">
            <!-- Pilih Nama -->
            <div class="input-field">
                <label for="nameSearch">
                    <i class="fas fa-user-graduate"></i> Nama Siswa
                </label>
                <div class="search-wrapper">
                    <input type="text" id="nameSearch" placeholder="Ketik atau pilih nama..." list="studentList"
                        autocomplete="off">
                    <i class="fas fa-chevron-down search-icon"></i>
                </div>
                <datalist id="studentList"></datalist>
            </div>

            <!-- Kelas (Readonly) -->
            <div class="input-field">
                <label for="kelas">
                    <i class="fas fa-door-open"></i> Kelas
                </label>
                <input type="text" id="kelas" readonly placeholder="Otomatis terisi">
            </div>

            <!-- Tanda Tangan -->
            <div class="signature-section">
                <label>
                    <i class="fas fa-pen"></i> Tanda Tangan Digital
                </label>
                <div class="canvas-wrapper">
                    <canvas id="signature-pad"></canvas>
                    <div class="canvas-placeholder">
                        <i class="fas fa-pencil-alt"></i>
                        <span>Tanda tangan di sini</span>
                    </div>
                </div>
                <button type="button" id="clear" class="clear-btn">
                    <i class="fas fa-undo-alt"></i> Hapus Tanda Tangan
                </button>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button id="cancelBtn" class="btn-cancel">
                <i class="fas fa-times"></i> Batal
            </button>
            <button id="submitBtn" class="btn-submit">
                <i class="fas fa-check"></i> Submit Absensi
            </button>
        </div>

        <!-- Footer Note -->
        <div class="footer-note">
            <i class="fas fa-shield-alt"></i>
            <span>Pastikan data sudah benar sebelum submit</span>
        </div>
    </div>

    <script type="module" src="scripts.js"></script>
</body>

</html>
